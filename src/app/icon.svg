<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BD873"/>
      <stop offset="1" stop-color="#249447"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset=".55" stop-color="#F5A529"/>
      <stop offset="1" stop-color="#D9801A"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE2A3"/>
      <stop offset="1" stop-color="#E9962A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b3d1c" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- vapeur -->
  <g fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".9">
    <path d="M196 150c-18-20 18-34 0-58"/>
    <path d="M256 134c-18-20 18-34 0-58"/>
    <path d="M316 150c-18-20 18-34 0-58"/>
  </g>
  <!-- feuilles de menthe, sous le nem -->
  <g transform="translate(118 392) rotate(-34)">
    <path d="M0 0c34-38 92-36 112 0-34 38-88 36-112 0z" fill="#E8FFE9"/>
    <path d="M10 0h88" stroke="#5BD873" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(150 410) rotate(14)">
    <path d="M0 0c26-30 72-28 88 0-26 30-70 28-88 0z" fill="#C9F7CF"/>
    <path d="M8 0h70" stroke="#3FB25A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- nem -->
  <g filter="url(#sh)" transform="translate(256 300) scale(1.1) rotate(-28) translate(-256 -304)">
    <rect x="96" y="246" width="320" height="116" rx="58" fill="url(#roll)"/>
    <!-- plis de la galette -->
    <g fill="none" stroke="#B8651A" stroke-width="7" stroke-linecap="round" opacity=".55">
      <path d="M176 252c-14 36-14 72 0 104"/>
      <path d="M246 250c-14 38-14 74 0 108"/>
      <path d="M316 252c-14 36-14 72 0 104"/>
    </g>
    <!-- reflet -->
    <rect x="126" y="262" width="220" height="22" rx="11" fill="#FFF3D6" opacity=".55"/>
    <!-- bout avec la farce -->
    <ellipse cx="400" cy="304" rx="22" ry="54" fill="url(#end)"/>
    <ellipse cx="402" cy="304" rx="12" ry="36" fill="#7A3E12" opacity=".35"/>
    <circle cx="398" cy="290" r="6" fill="#57B65A"/>
    <circle cx="404" cy="314" r="5" fill="#E2532C"/>
  </g>
</svg>
